<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScraper - Busca y Disfruta</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#141414;color:#fff}
        .header{background:#000;padding:15px;text-align:center}
        .header h1{color:#e50914}
        .search-container{max-width:600px;margin:40px auto;padding:20px}
        .search-box{display:flex;gap:10px}
        .search-box input{flex:1;padding:12px;border:none;border-radius:4px;background:#2a2a2a;color:#fff}
        .search-box button{padding:12px 24px;background:#e50914;color:#fff;border:none;border-radius:4px;cursor:pointer}
        .results{padding:20px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
        .movie-card{width:200px;background:#1a1a1a;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform 0.3s}
        .movie-card:hover{transform:scale(1.05)}
        .movie-card img{width:100%;height:280px;object-fit:cover}
        .movie-card .no-image{height:280px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:48px}
        .movie-card h3{padding:10px;font-size:14px;text-align:center}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000}
        .modal-content{max-width:900px;margin:40px auto;background:#141414;border-radius:8px;overflow:hidden}
        .modal-header{padding:15px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center}
        .modal-header h2{margin:0}
        .close{font-size:28px;cursor:pointer;color:#fff}
        .modal-body{padding:20px}
        .player-frame{width:100%;height:400px;background:#000}
        .player-frame iframe{width:100%;height:100%;border:none}
        .servers-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
        .server-btn{padding:10px 20px;background:#2a2a2a;border:none;border-radius:4px;color:#fff;cursor:pointer}
        .server-btn:hover{background:#e50914}
        .loading{text-align:center;padding:40px}
        .no-results{text-align:center;padding:40px;color:#888}
    </style>
</head>
<body>
<div class="header">
    <h1>CINESCRAPER</h1>
    <p>Busca y Disfruta</p>
</div>
<div class="search-container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ej: protector, 12 desafíos, batman..." autocomplete="off">
        <button onclick="searchMovies()">🔍 Buscar</button>
    </div>
</div>
<div id="results" class="results"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Película</h2>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="playerFrame" class="player-frame">
                <div class="loading">Selecciona un servidor para reproducir</div>
            </div>
            <div id="serversList" class="servers-list"></div>
        </div>
    </div>
</div>

<script>
const API_URL = '/api/v1/movies';

async function searchMovies() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return alert('Escribe una película');
    
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '<div class="loading">🔍 Buscando...</div>';
    
    try {
        const response = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        
        if (!data.results || data.results.length === 0) {
            resultsDiv.innerHTML = '<div class="no-results">😞 No se encontraron resultados</div>';
            return;
        }
        
        resultsDiv.innerHTML = '';
        data.results.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                ${movie.thumbnail ? `<img src="${movie.thumbnail}" alt="${movie.title}">` : '<div class="no-image">🎬</div>'}
                <h3>${movie.title}</h3>
            `;
            card.onclick = () => getMovieInfo(movie.url);
            resultsDiv.appendChild(card);
        });
    } catch (error) {
        resultsDiv.innerHTML = '<div class="no-results">❌ Error al buscar</div>';
        console.error(error);
    }
}

async function getMovieInfo(url) {
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const playerFrame = document.getElementById('playerFrame');
    const serversList = document.getElementById('serversList');
    
    modalTitle.innerText = 'Cargando...';
    playerFrame.innerHTML = '<div class="loading">Cargando información...</div>';
    serversList.innerHTML = '';
    modal.style.display = 'block';
    
    try {
        const response = await fetch(`${API_URL}/info?url=${encodeURIComponent(url)}`);
        const data = await response.json();
        
        if (!data.data) {
            playerFrame.innerHTML = '<div class="loading">❌ No se pudo cargar la información</div>';
            return;
        }
        
        const movie = data.data;
        modalTitle.innerText = movie.title || 'Película';
        
        // Mostrar servidores
        if (movie.downloadLinks && movie.downloadLinks.length > 0) {
            serversList.innerHTML = '';
            movie.downloadLinks.forEach(link => {
                const btn = document.createElement('button');
                btn.className = 'server-btn';
                btn.textContent = link.server || 'Servidor';
                btn.onclick = () => {
                    playerFrame.innerHTML = `<iframe src="${link.url}" frameborder="0" allowfullscreen></iframe>`;
                };
                serversList.appendChild(btn);
            });
            playerFrame.innerHTML = '<div class="loading">Selecciona un servidor para reproducir</div>';
        } else {
            serversList.innerHTML = '<p>⚠️ No hay servidores disponibles</p>';
            playerFrame.innerHTML = '<div class="loading">No hay servidores para esta película</div>';
        }
        
    } catch (error) {
        console.error('Error:', error);
        playerFrame.innerHTML = '<div class="loading">❌ Error al cargar</div>';
    }
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchMovies();
});
</script>
</body>
</html>
